[project]
name = "tg-legal-platform"
version = "0.1.0"
description = "Telegram session registry, health monitoring and official legal reporting case-management platform"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13",
  "structlog>=24",
  "cryptography>=42",
  "passlib[argon2]>=1.7",
  "python-jose[cryptography]>=3.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "reportlab>=4",
  "psutil>=5.9",
  "redis>=5",
  "httpx>=0.27",
  "greenlet>=3",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36", "python-socks[asyncio]>=2.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4"]

[project.scripts]
app = "app.cli.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
