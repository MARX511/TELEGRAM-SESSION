services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tglegal
      POSTGRES_PASSWORD: tglegal
      POSTGRES_DB: tglegal
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tglegal"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tglegal:tglegal@postgres:5432/tglegal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
    volumes:
      - ./sessions:/app/sessions
      - ./evidence_store:/app/evidence_store
      - ./backups:/app/backups
      - ./exports:/app/exports
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
